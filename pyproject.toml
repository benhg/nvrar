[build-system]
requires = [
  "scikit-build-core>=0.9",
  "cmake>=3.24",
  "ninja",
  "pybind11>=2.11",
  "packaging",
]
build-backend = "scikit_build_core.build"

[project]
name = "nvrar"
version = "0.0.1"
description = "NVSHMEM-based Low-Latency All-Reduce for LLM Inference"
requires-python = ">=3.9"
dependencies = ["torch>=2.7"]
authors = [{ name = "Prajwal Singhania, Abhinav Bhatele" }]


[tool.scikit-build]
cmake.minimum-version = "3.24"
cmake.verbose = true
cmake.source-dir = "nvrar/csrc"
sdist.include = ["nvrar/csrc/**", "nvrar/**", "LICENSE", "README.md"]
